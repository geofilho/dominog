name: Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Mantém a mesma chave de assinatura em todos os builds, para o APK
      # poder ser instalado por cima da versão anterior.
      - name: Chave de assinatura fixa
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dominog-debug-keystore-v1
      - name: Testes e build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DominoG.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DominoG-apk
          path: DominoG.apk
      - name: Publicar APK na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versao
          name: Dominó G (última versão)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "APK gerado automaticamente do commit ${{ github.sha }}. Baixe DominoG.apk e instale no celular."
          files: DominoG.apk
