name: Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Mantém a mesma chave de assinatura em todos os builds, para o APK
      # poder ser instalado por cima da versão anterior. A chave é criada uma vez
      # e fica guardada no cache do Actions (nunca no repositório).
      - name: Restaurar chave de assinatura
        uses: actions/cache@v4
        with:
          path: ~/dominog-chave
          key: dominog-chave-assinatura-v1
      - name: Criar chave de assinatura (só na primeira vez)
        run: |
          mkdir -p ~/dominog-chave
          if [ ! -f ~/dominog-chave/chave.jks ]; then
            head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' > ~/dominog-chave/senha.txt
            keytool -genkeypair -keystore ~/dominog-chave/chave.jks -alias dominog \
              -storepass "$(cat ~/dominog-chave/senha.txt)" -keypass "$(cat ~/dominog-chave/senha.txt)" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Domino G, C=BR"
          fi
          echo "::add-mask::$(cat ~/dominog-chave/senha.txt)"
          echo "DOMINOG_KEYSTORE=$HOME/dominog-chave/chave.jks" >> "$GITHUB_ENV"
          echo "DOMINOG_KEYSTORE_PASS=$(cat ~/dominog-chave/senha.txt)" >> "$GITHUB_ENV"
      - name: Testes e build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DominoG.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DominoG-apk
          path: DominoG.apk
      - name: Publicar APK na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versao
          name: Dominó G (última versão)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "APK gerado automaticamente do commit ${{ github.sha }}. Baixe DominoG.apk e instale no celular."
          files: DominoG.apk
