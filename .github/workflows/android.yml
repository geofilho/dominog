name: Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Um build por vez: o APK publicado é sempre o do último envio.
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Mantém a mesma chave de assinatura em todos os builds, para o APK
      # poder ser instalado por cima da versão anterior. A chave é criada uma vez
      # e fica guardada no cache do Actions (nunca no repositório).
      - name: Restaurar chave de assinatura
        uses: actions/cache@v4
        with:
          path: ~/dominog-chave
          key: dominog-chave-assinatura-v1
      - name: Criar chave de assinatura (só na primeira vez)
        run: |
          mkdir -p ~/dominog-chave
          if [ ! -f ~/dominog-chave/chave.jks ]; then
            head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' > ~/dominog-chave/senha.txt
            keytool -genkeypair -keystore ~/dominog-chave/chave.jks -alias dominog \
              -storepass "$(cat ~/dominog-chave/senha.txt)" -keypass "$(cat ~/dominog-chave/senha.txt)" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Domino G, C=BR"
          fi
          echo "::add-mask::$(cat ~/dominog-chave/senha.txt)"
          echo "DOMINOG_KEYSTORE=$HOME/dominog-chave/chave.jks" >> "$GITHUB_ENV"
          echo "DOMINOG_KEYSTORE_PASS=$(cat ~/dominog-chave/senha.txt)" >> "$GITHUB_ENV"
      - name: Testes e build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DominoG.apk
          echo "$GITHUB_RUN_NUMBER" > version.txt
          # Novidades = todas as mudanças desde a versão publicada anterior (sem ajustes internos "Build:")
          PREV=$(curl -sfL https://github.com/${{ github.repository }}/releases/download/ultima-versao/commit.txt || true)
          if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then RANGE="$PREV..HEAD"; else RANGE="-1"; fi
          git log $RANGE --no-merges --invert-grep --grep='^Build:' --pretty='%B' \
            | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed 's/ *\[teste\]//' | cat -s > novidades.txt
          [ -s novidades.txt ] || echo "Melhorias internas." > novidades.txt
          git rev-parse HEAD > commit.txt
      # Commit com "[teste]" na mensagem: gera um APK de teste separado, sem publicar a versão oficial.
      - name: Tipo de publicação
        id: tipo
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$MSG" | grep -q '\[teste\]'; then echo "teste=1" >> "$GITHUB_OUTPUT"; else echo "teste=0" >> "$GITHUB_OUTPUT"; fi
      - name: Publicar APK de teste
        if: steps.tipo.outputs.teste == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teste
          name: Dominó G (teste, não oficial)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "APK de TESTE (versão 1.0.${{ github.run_number }}), ainda não publicado como oficial."
          files: DominoG.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DominoG-apk
          path: DominoG.apk
      - name: Publicar APK na página de Releases
        if: steps.tipo.outputs.teste != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versao
          name: Dominó G (última versão)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "APK gerado automaticamente do commit ${{ github.sha }}. Baixe DominoG.apk e instale no celular."
          files: |
            DominoG.apk
            version.txt
            novidades.txt
            commit.txt
      # Guarda também cada versão numa publicação própria (o link da última versão não muda).
      - name: Guardar esta versão (histórico)
        if: steps.tipo.outputs.teste != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dominó G 1.0.${{ github.run_number }}
          prerelease: false
          # "Latest": o link releases/latest/download/DominoG.apk leva a esta versão.
          make_latest: true
          target_commitish: ${{ github.sha }}
          body_path: novidades.txt
          files: |
            DominoG.apk
